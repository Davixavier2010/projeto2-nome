<!DOCTYPE html>
<html>
<body>
<canvas id="canvas"></canvas>
<script>
window.onload = function() {
  const img = new Image();
  img.src = '/assets/images/logo-rida.png';
  img.onload = function() {
    // Crop strictly to the logo emblem (center area)
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;

    // Find bounding box of the logo
    let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const idx = (y * canvas.width + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        if (r < 225 || g < 225 || b < 220) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    // Add small padding
    const pad = 10;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(canvas.width, maxX + pad);
    maxY = Math.min(canvas.height, maxY + pad);

    const cropW = maxX - minX;
    const cropH = maxY - minY;

    // 1. Transparent original
    const cropCanvas = document.createElement('canvas');
    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    const cropCtx = cropCanvas.getContext('2d');

    const transData = cropCtx.createImageData(cropW, cropH);
    const whiteData = cropCtx.createImageData(cropW, cropH);

    for (let y = 0; y < cropH; y++) {
      for (let x = 0; x < cropW; x++) {
        const srcIdx = ((minY + y) * canvas.width + (minX + x)) * 4;
        const dstIdx = (y * cropW + x) * 4;

        const r = data[srcIdx];
        const g = data[srcIdx + 1];
        const b = data[srcIdx + 2];

        const isBg = (r > 225 && g > 225 && b > 220);

        if (isBg) {
          transData.data[dstIdx + 3] = 0;
          whiteData.data[dstIdx + 3] = 0;
        } else {
          transData.data[dstIdx] = r;
          transData.data[dstIdx + 1] = g;
          transData.data[dstIdx + 2] = b;
          transData.data[dstIdx + 3] = 255;

          // Pure white logo with anti-aliasing preserved
          whiteData.data[dstIdx] = 255;
          whiteData.data[dstIdx + 1] = 255;
          whiteData.data[dstIdx + 2] = 255;
          whiteData.data[dstIdx + 3] = 255;
        }
      }
    }

    cropCtx.putImageData(transData, 0, 0);
    const transBase64 = cropCanvas.toDataURL('image/png');

    cropCtx.putImageData(whiteData, 0, 0);
    const whiteBase64 = cropCanvas.toDataURL('image/png');

    fetch('/api/save-logo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transBase64, whiteBase64 })
    }).then(r => r.text()).then(t => {
      document.body.innerHTML = '<h1>SAVED</h1>';
      console.log('Saved:', t);
    });
  };
};
</script>
</body>
</html>
