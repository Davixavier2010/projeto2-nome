<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="100%" stop-color="#E2A624"/>
    </linearGradient>
  </defs>

  <!-- Phone Shell -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="#0d0e12" stroke="#222" stroke-width="4"/>
  <rect x="8" y="8" width="364" height="764" rx="39" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Screen Area -->
  <g clip-path="url(#screenClipBarber)">
    <clipPath id="screenClipBarber">
      <rect x="15" y="15" width="350" height="750" rx="32" fill="#fff"/>
    </clipPath>

    <!-- Screen Background -->
    <rect x="15" y="15" width="350" height="750" fill="#0f1115"/>

    <!-- Status Bar -->
    <text x="42" y="38" fill="#f0f0f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
    <rect x="135" y="24" width="110" height="24" rx="12" fill="#000"/>
    <circle cx="225" cy="36" r="4" fill="#1b2430"/>
    <path d="M 315 28 h 14 a 2 2 0 0 1 2 2 v 8 a 2 2 0 0 1 -2 2 h -14 a 2 2 0 0 1 -2 -2 v -8 a 2 2 0 0 1 2 -2 z" fill="none" stroke="#fff" stroke-width="1.5"/>
    <rect x="317" y="30" width="8" height="8" rx="1" fill="#25D366"/>
    <path d="M 333 32 h 2 v 4 h -2 z" fill="#fff"/>

    <!-- Barber Site Header -->
    <rect x="15" y="58" width="350" height="56" fill="#15181f" opacity="0.95"/>
    <circle cx="45" cy="86" r="16" fill="url(#goldGradient)"/>
    <path d="M 40 80 l 10 12 M 45 78 l 6 7 M 39 88 l 6 7" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <text x="70" y="83" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">BARBA &amp; ESTILO</text>
    <text x="70" y="96" fill="#F5D061" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Nota 4.9 no Google (182 avaliações)</text>
    <rect x="305" y="74" width="45" height="24" rx="6" fill="#25D366"/>
    <text x="313" y="90" fill="#fff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">Abrir</text>

    <!-- Hero Card Barbearia -->
    <g transform="translate(25, 126)">
      <rect x="0" y="0" width="330" height="175" rx="16" fill="#1d212b" stroke="#2e3546" stroke-width="1"/>
      <rect x="12" y="14" width="80" height="20" rx="10" fill="#2e3546"/>
      <text x="52" y="28" text-anchor="middle" fill="#F5D061" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">VIP LOUNGE</text>
      
      <text x="14" y="60" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Corte &amp; Barba com</text>
      <text x="14" y="82" fill="#F5D061" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Cerveja Gelada</text>
      <text x="14" y="103" fill="#a0a8ba" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Ambiente climatizado, sinuca e os melhores profissionais da cidade.</text>

      <!-- Primary CTA button -->
      <g transform="translate(14, 120)">
        <rect x="0" y="0" width="302" height="42" rx="10" fill="#25D366"/>
        <text x="151" y="26" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">AGENDAR MEU HORÁRIO</text>
      </g>
    </g>

    <!-- Services Header -->
    <text x="28" y="325" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">Serviços Populares</text>
    <text x="290" y="325" fill="#F5D061" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Ver Todos</text>

    <!-- Service Item 1 -->
    <g transform="translate(25, 338)">
      <rect x="0" y="0" width="330" height="66" rx="12" fill="#181c24" stroke="#252c3a" stroke-width="1"/>
      <rect x="12" y="11" width="44" height="44" rx="8" fill="#262d3d"/>
      <path d="M 28 26 L 40 40 M 40 26 L 28 40" stroke="#F5D061" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="28" cy="26" r="3" fill="none" stroke="#F5D061" stroke-width="2"/>
      <circle cx="40" cy="26" r="3" fill="none" stroke="#F5D061" stroke-width="2"/>
      <text x="68" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Corte Degrade Navalhado</text>
      <text x="68" y="47" fill="#8892a4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Lavagem + Finalização</text>
      <text x="260" y="38" fill="#F5D061" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">R$ 45</text>
      <rect x="298" y="24" width="22" height="22" rx="11" fill="#25D366" opacity="0.2"/>
      <path d="M 305 35 l 3 3 l 6 -6" stroke="#25D366" stroke-width="2" fill="none"/>
    </g>

    <!-- Service Item 2 -->
    <g transform="translate(25, 414)">
      <rect x="0" y="0" width="330" height="66" rx="12" fill="#181c24" stroke="#252c3a" stroke-width="1"/>
      <rect x="12" y="11" width="44" height="44" rx="8" fill="#262d3d"/>
      <rect x="26" y="28" width="16" height="10" rx="2" fill="none" stroke="#F5D061" stroke-width="2"/>
      <line x1="34" y1="28" x2="34" y2="38" stroke="#F5D061" stroke-width="2"/>
      <text x="68" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Barboterapia Completa</text>
      <text x="68" y="47" fill="#8892a4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Toalha quente + Óleo especial</text>
      <text x="260" y="38" fill="#F5D061" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">R$ 40</text>
      <rect x="298" y="24" width="22" height="22" rx="11" fill="#25D366" opacity="0.2"/>
      <path d="M 305 35 l 3 3 l 6 -6" stroke="#25D366" stroke-width="2" fill="none"/>
    </g>

    <!-- Service Item 3 -->
    <g transform="translate(25, 490)">
      <rect x="0" y="0" width="330" height="66" rx="12" fill="#181c24" stroke="#252c3a" stroke-width="1"/>
      <rect x="12" y="11" width="44" height="44" rx="8" fill="#262d3d"/>
      <circle cx="34" cy="33" r="8" fill="none" stroke="#F5D061" stroke-width="2"/>
      <path d="M 34 29 L 34 33 L 37 35" stroke="#F5D061" stroke-width="1.8" stroke-linecap="round"/>
      <text x="68" y="30" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Combo Cabelo + Barba</text>
      <text x="68" y="47" fill="#8892a4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Corte + Barboterapia + Bebida</text>
      <text x="260" y="38" fill="#F5D061" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">R$ 75</text>
      <rect x="298" y="24" width="22" height="22" rx="11" fill="#25D366" opacity="0.2"/>
      <path d="M 305 35 l 3 3 l 6 -6" stroke="#25D366" stroke-width="2" fill="none"/>
    </g>

    <!-- Location Card -->
    <g transform="translate(25, 568)">
      <rect x="0" y="0" width="330" height="74" rx="12" fill="#14171e" stroke="#232936" stroke-width="1"/>
      <text x="16" y="24" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Onde Estamos</text>
      <text x="16" y="42" fill="#a0a8ba" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Av. Central, 450 - Centro (Estacionamento Grátis)</text>
      <text x="16" y="60" fill="#25D366" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Aberto hoje até às 20h</text>
    </g>

    <!-- Bottom Mobile Nav Bar -->
    <rect x="15" y="690" width="350" height="75" fill="#111317"/>
    <g transform="translate(35, 712)">
      <text x="25" y="24" text-anchor="middle" fill="#F5D061" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Início</text>
      <text x="105" y="24" text-anchor="middle" fill="#8892a4" font-family="'Segoe UI', sans-serif" font-size="12">Serviços</text>
      <text x="195" y="24" text-anchor="middle" fill="#8892a4" font-family="'Segoe UI', sans-serif" font-size="12">Local</text>
      <text x="280" y="24" text-anchor="middle" fill="#25D366" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">WhatsApp</text>
    </g>
    <!-- Home Bar Indicator -->
    <rect x="125" y="746" width="130" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
