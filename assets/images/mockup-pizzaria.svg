<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="pizzaHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#8E1C13"/>
    </linearGradient>
  </defs>

  <!-- Phone Shell -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="#120c0a" stroke="#2b1a15" stroke-width="4"/>
  <rect x="8" y="8" width="364" height="764" rx="39" fill="none" stroke="#4a2d22" stroke-width="1.5"/>

  <!-- Screen Area -->
  <g clip-path="url(#screenClipPizza)">
    <clipPath id="screenClipPizza">
      <rect x="15" y="15" width="350" height="750" rx="32" fill="#fff"/>
    </clipPath>

    <!-- Screen Background -->
    <rect x="15" y="15" width="350" height="750" fill="#18110e"/>

    <!-- Status Bar -->
    <text x="42" y="38" fill="#f0f0f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">19:30</text>
    <rect x="135" y="24" width="110" height="24" rx="12" fill="#000"/>
    <circle cx="225" cy="36" r="4" fill="#301b1b"/>
    <path d="M 315 28 h 14 a 2 2 0 0 1 2 2 v 8 a 2 2 0 0 1 -2 2 h -14 a 2 2 0 0 1 -2 -2 v -8 a 2 2 0 0 1 2 -2 z" fill="none" stroke="#fff" stroke-width="1.5"/>
    <rect x="317" y="30" width="10" height="8" rx="1" fill="#25D366"/>
    <path d="M 333 32 h 2 v 4 h -2 z" fill="#fff"/>

    <!-- Pizzeria Site Header -->
    <rect x="15" y="58" width="350" height="58" fill="url(#pizzaHeader)"/>
    <circle cx="46" cy="87" r="17" fill="#fff"/>
    <!-- Pizza slice graphic -->
    <path d="M 40 80 L 53 87 L 40 94 Z" fill="#C0392B"/>
    <circle cx="44" cy="85" r="1.5" fill="#FFE5A3"/>
    <circle cx="45" cy="89" r="1.5" fill="#FFE5A3"/>
    <text x="72" y="82" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900">BELLA NAPOLI PIZZA</text>
    <text x="72" y="97" fill="#FFE5A3" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Entrega Rápida • Nota 4.9 no Google</text>
    <rect x="290" y="73" width="60" height="26" rx="6" fill="#25D366"/>
    <text x="320" y="89" text-anchor="middle" fill="#fff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">PEDIR</text>

    <!-- Hero Promo Banner -->
    <g transform="translate(25, 126)">
      <rect x="0" y="0" width="330" height="170" rx="16" fill="#251713" stroke="#4a251b" stroke-width="1"/>
      <rect x="12" y="12" width="100" height="20" rx="10" fill="#E24A24"/>
      <text x="62" y="26" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PROMO DO DIA</text>
      
      <text x="14" y="58" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Pizza Grande + Refri 2L</text>
      <text x="14" y="78" fill="#FFC107" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Apenas R$ 54,90</text>
      <text x="14" y="98" fill="#c4a59d" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Massa artesanal de fermentação lenta com queijo derretido de verdade.</text>

      <!-- Primary CTA button -->
      <g transform="translate(14, 114)">
        <rect x="0" y="0" width="302" height="42" rx="10" fill="#25D366"/>
        <text x="151" y="26" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">PEDIR DIRETO NO WHATSAPP</text>
      </g>
    </g>

    <!-- Category Filters -->
    <g transform="translate(25, 310)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#E24A24"/>
      <text x="40" y="18" text-anchor="middle" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Pizzas</text>
      
      <rect x="88" y="0" width="80" height="28" rx="14" fill="#2e1b14"/>
      <text x="128" y="18" text-anchor="middle" fill="#c4a59d" font-family="'Segoe UI', sans-serif" font-size="11">Burgers</text>

      <rect x="176" y="0" width="80" height="28" rx="14" fill="#2e1b14"/>
      <text x="216" y="18" text-anchor="middle" fill="#c4a59d" font-family="'Segoe UI', sans-serif" font-size="11">Bebidas</text>

      <rect x="264" y="0" width="66" height="28" rx="14" fill="#2e1b14"/>
      <text x="297" y="18" text-anchor="middle" fill="#c4a59d" font-family="'Segoe UI', sans-serif" font-size="11">Doces</text>
    </g>

    <!-- Food Item 1 -->
    <g transform="translate(25, 350)">
      <rect x="0" y="0" width="330" height="74" rx="12" fill="#211511" stroke="#3d2119" stroke-width="1"/>
      <rect x="10" y="10" width="54" height="54" rx="10" fill="#3a1f16"/>
      <!-- Pizza Slice vector -->
      <path d="M 24 24 L 50 37 L 24 50 Z" fill="#E24A24"/>
      <circle cx="32" cy="34" r="2.5" fill="#FFC107"/>
      <circle cx="35" cy="40" r="2" fill="#FFC107"/>
      <text x="74" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Pizza Calabresa Especial</text>
      <text x="74" y="44" fill="#a88e86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">Mussarela, calabresa fatiada e orégano</text>
      <text x="74" y="62" fill="#FFC107" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">R$ 49,90</text>
      <rect x="250" y="24" width="70" height="28" rx="6" fill="#25D366"/>
      <text x="285" y="42" text-anchor="middle" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">+ Pedir</text>
    </g>

    <!-- Food Item 2 -->
    <g transform="translate(25, 434)">
      <rect x="0" y="0" width="330" height="74" rx="12" fill="#211511" stroke="#3d2119" stroke-width="1"/>
      <rect x="10" y="10" width="54" height="54" rx="10" fill="#3a1f16"/>
      <circle cx="37" cy="37" r="16" fill="none" stroke="#FFC107" stroke-width="2.5"/>
      <path d="M 27 37 H 47 M 37 27 V 47" stroke="#FFC107" stroke-width="1.5"/>
      <text x="74" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Pizza 4 Queijos Suprema</text>
      <text x="74" y="44" fill="#a88e86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">Mussarela, gorgonzola, provolone e catupiry</text>
      <text x="74" y="62" fill="#FFC107" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">R$ 57,90</text>
      <rect x="250" y="24" width="70" height="28" rx="6" fill="#25D366"/>
      <text x="285" y="42" text-anchor="middle" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">+ Pedir</text>
    </g>

    <!-- Food Item 3 -->
    <g transform="translate(25, 518)">
      <rect x="0" y="0" width="330" height="74" rx="12" fill="#211511" stroke="#3d2119" stroke-width="1"/>
      <rect x="10" y="10" width="54" height="54" rx="10" fill="#3a1f16"/>
      <!-- Burger bun vector -->
      <path d="M 23 34 C 23 26 51 26 51 34 Z" fill="#E2A624"/>
      <rect x="23" y="37" width="28" height="4" rx="2" fill="#8E1C13"/>
      <path d="M 23 44 C 23 48 51 48 51 44 Z" fill="#E2A624"/>
      <text x="74" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Smash Burger Bacon Cheddar</text>
      <text x="74" y="44" fill="#a88e86" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">2x carnes 100g, cheddar duplo e bacon crocante</text>
      <text x="74" y="62" fill="#FFC107" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">R$ 34,90</text>
      <rect x="250" y="24" width="70" height="28" rx="6" fill="#25D366"/>
      <text x="285" y="42" text-anchor="middle" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">+ Pedir</text>
    </g>

    <!-- Delivery Time info -->
    <g transform="translate(25, 602)">
      <rect x="0" y="0" width="330" height="66" rx="12" fill="#1b120f" stroke="#351d16" stroke-width="1"/>
      <text x="16" y="24" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tempo Médio de Entrega</text>
      <text x="16" y="42" fill="#c4a59d" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">30 a 45 minutos para o seu bairro</text>
      <text x="16" y="56" fill="#25D366" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Pedidos abertos • Aceitamos Cartão e Pix</text>
    </g>

    <!-- Bottom Mobile Nav Bar -->
    <rect x="15" y="690" width="350" height="75" fill="#130d0a"/>
    <g transform="translate(35, 712)">
      <text x="25" y="24" text-anchor="middle" fill="#FFC107" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Cardápio</text>
      <text x="105" y="24" text-anchor="middle" fill="#a88e86" font-family="'Segoe UI', sans-serif" font-size="12">Promoções</text>
      <text x="195" y="24" text-anchor="middle" fill="#a88e86" font-family="'Segoe UI', sans-serif" font-size="12">Entrega</text>
      <text x="280" y="24" text-anchor="middle" fill="#25D366" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">WhatsApp</text>
    </g>
    <!-- Home Bar Indicator -->
    <rect x="125" y="746" width="130" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
