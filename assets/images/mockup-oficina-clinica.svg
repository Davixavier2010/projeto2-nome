<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#071524"/>
    </linearGradient>
  </defs>

  <!-- Phone Shell -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="#09131d" stroke="#142334" stroke-width="4"/>
  <rect x="8" y="8" width="364" height="764" rx="39" fill="none" stroke="#1a2e45" stroke-width="1.5"/>

  <!-- Screen Area -->
  <g clip-path="url(#screenClipClinic)">
    <clipPath id="screenClipClinic">
      <rect x="15" y="15" width="350" height="750" rx="32" fill="#fff"/>
    </clipPath>

    <!-- Screen Background -->
    <rect x="15" y="15" width="350" height="750" fill="#F4F7FA"/>

    <!-- Status Bar -->
    <text x="42" y="38" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">14:15</text>
    <rect x="135" y="24" width="110" height="24" rx="12" fill="#000"/>
    <circle cx="225" cy="36" r="4" fill="#1b2430"/>
    <path d="M 315 28 h 14 a 2 2 0 0 1 2 2 v 8 a 2 2 0 0 1 -2 2 h -14 a 2 2 0 0 1 -2 -2 v -8 a 2 2 0 0 1 2 -2 z" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="317" y="30" width="10" height="8" rx="1" fill="#25D366"/>
    <path d="M 333 32 h 2 v 4 h -2 z" fill="#1e293b"/>

    <!-- Clinic Header Navy -->
    <rect x="15" y="58" width="350" height="60" fill="url(#clinicHeader)"/>
    <circle cx="46" cy="88" r="17" fill="#ffffff" opacity="0.15"/>
    <path d="M 46 80 V 96 M 38 88 H 54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="72" y="83" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">CLÍNICA VIVER BEM</text>
    <text x="72" y="98" fill="#CADBE9" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Nota 4.9 no Google • CRM/CRO Ativo</text>
    <rect x="290" y="73" width="60" height="26" rx="6" fill="#25D366"/>
    <text x="320" y="89" text-anchor="middle" fill="#fff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">CONTATO</text>

    <!-- Hero Card Clinic -->
    <g transform="translate(25, 128)">
      <rect x="0" y="0" width="330" height="175" rx="16" fill="#ffffff" stroke="#dbe3eb" stroke-width="1"/>
      <rect x="14" y="14" width="115" height="20" rx="10" fill="#E4ECF4"/>
      <text x="71" y="27" text-anchor="middle" fill="#0F2942" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ESPECIALIDADES</text>
      
      <text x="14" y="60" fill="#0F172A" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Cuidado e Confiança</text>
      <text x="14" y="80" fill="#0F2942" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">Para Toda a Sua Família</text>
      <text x="14" y="100" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Atendimento humanizado, exames no mesmo dia e equipe qualificada.</text>

      <!-- Primary CTA button -->
      <g transform="translate(14, 118)">
        <rect x="0" y="0" width="302" height="42" rx="10" fill="#25D366"/>
        <text x="151" y="26" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">AGENDAR CONSULTA VIA WHATSAPP</text>
      </g>
    </g>

    <!-- Trust Badges -->
    <g transform="translate(25, 314)">
      <rect x="0" y="0" width="104" height="42" rx="8" fill="#ffffff" stroke="#dbe3eb"/>
      <path d="M 52 14 L 60 17 L 60 23 C 60 28 52 31 52 31 C 52 31 44 28 44 23 L 44 17 Z" fill="none" stroke="#0F2942" stroke-width="1.5"/>
      <text x="52" y="36" text-anchor="middle" fill="#0F2942" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Credenciados</text>

      <rect x="113" y="0" width="104" height="42" rx="8" fill="#ffffff" stroke="#dbe3eb"/>
      <path d="M 166 14 L 160 22 H 168 L 164 30" stroke="#0F2942" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      <text x="165" y="36" text-anchor="middle" fill="#0F2942" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Sem Filas</text>

      <rect x="226" y="0" width="104" height="42" rx="8" fill="#ffffff" stroke="#dbe3eb"/>
      <rect x="270" y="16" width="16" height="12" rx="2" fill="none" stroke="#0F2942" stroke-width="1.5"/>
      <line x1="270" y1="20" x2="286" y2="20" stroke="#0F2942" stroke-width="1.5"/>
      <text x="278" y="36" text-anchor="middle" fill="#0F2942" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Facilitado</text>
    </g>

    <!-- Services Header -->
    <text x="28" y="380" fill="#0F172A" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">Nossos Serviços &amp; Exames</text>

    <!-- Clinic Item 1 -->
    <g transform="translate(25, 394)">
      <rect x="0" y="0" width="330" height="66" rx="12" fill="#ffffff" stroke="#dbe3eb" stroke-width="1"/>
      <rect x="12" y="11" width="44" height="44" rx="8" fill="#E4ECF4"/>
      <path d="M 34 22 V 32 C 34 37 26 37 26 32 V 22" fill="none" stroke="#0F2942" stroke-width="1.8"/>
      <circle cx="34" cy="40" r="3" fill="#0F2942"/>
      <text x="68" y="30" fill="#0F172A" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Clínica Geral &amp; Check-up</text>
      <text x="68" y="47" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Avaliação completa de saúde</text>
      <rect x="250" y="20" width="68" height="26" rx="6" fill="#0F2942"/>
      <text x="284" y="36" text-anchor="middle" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Ver Mais</text>
    </g>

    <!-- Clinic Item 2 -->
    <g transform="translate(25, 470)">
      <rect x="0" y="0" width="330" height="66" rx="12" fill="#ffffff" stroke="#dbe3eb" stroke-width="1"/>
      <rect x="12" y="11" width="44" height="44" rx="8" fill="#FEF3C7"/>
      <path d="M 30 24 C 27 24 26 27 26 31 C 26 38 29 44 31 44 C 33 44 34 38 34 38 C 34 38 35 44 37 44 C 39 44 42 38 42 31 C 42 27 41 24 38 24 C 35 24 34 26 34 26 C 34 26 33 24 30 24 Z" fill="none" stroke="#D97706" stroke-width="1.8"/>
      <text x="68" y="30" fill="#0F172A" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Odontologia &amp; Estética Dental</text>
      <text x="68" y="47" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Limpeza, clareamento e alinhador</text>
      <rect x="250" y="20" width="68" height="26" rx="6" fill="#0F2942"/>
      <text x="284" y="36" text-anchor="middle" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Ver Mais</text>
    </g>

    <!-- Clinic Item 3 -->
    <g transform="translate(25, 546)">
      <rect x="0" y="0" width="330" height="66" rx="12" fill="#ffffff" stroke="#dbe3eb" stroke-width="1"/>
      <rect x="12" y="11" width="44" height="44" rx="8" fill="#DCFCE7"/>
      <path d="M 28 42 H 40 M 34 42 V 32 M 34 26 L 39 20" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="34" cy="28" r="4" fill="none" stroke="#16A34A" stroke-width="1.5"/>
      <text x="68" y="30" fill="#0F172A" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Exames Laboratoriais</text>
      <text x="68" y="47" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Resultados rápidos e online</text>
      <rect x="250" y="20" width="68" height="26" rx="6" fill="#0F2942"/>
      <text x="284" y="36" text-anchor="middle" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">Ver Mais</text>
    </g>

    <!-- Location & Horário -->
    <g transform="translate(25, 622)">
      <rect x="0" y="0" width="330" height="58" rx="12" fill="#ffffff" stroke="#dbe3eb" stroke-width="1"/>
      <text x="16" y="24" fill="#0F172A" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Rua das Palmeiras, 120 - Sala 301</text>
      <text x="16" y="42" fill="#25D366" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Segunda a Sábado: 07:00 às 19:00</text>
    </g>

    <!-- Bottom Mobile Nav Bar -->
    <rect x="15" y="690" width="350" height="75" fill="#ffffff" stroke="#dbe3eb" stroke-width="1"/>
    <g transform="translate(35, 712)">
      <text x="25" y="24" text-anchor="middle" fill="#0F2942" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Clínica</text>
      <text x="105" y="24" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="12">Serviços</text>
      <text x="195" y="24" text-anchor="middle" fill="#64748B" font-family="'Segoe UI', sans-serif" font-size="12">Onde</text>
      <text x="280" y="24" text-anchor="middle" fill="#25D366" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">WhatsApp</text>
    </g>
    <!-- Home Bar Indicator -->
    <rect x="125" y="746" width="130" height="4" rx="2" fill="#000000" opacity="0.3"/>
  </g>
</svg>
