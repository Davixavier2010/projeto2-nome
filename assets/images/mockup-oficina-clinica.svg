<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="clinicHeaderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0A1C2E"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Phone Chassis -->
  <rect x="5" y="5" width="370" height="770" rx="42" fill="#09131d" stroke="#1e2e42" stroke-width="4"/>
  <rect x="8" y="8" width="364" height="764" rx="39" fill="none" stroke="#283a52" stroke-width="1.5"/>

  <!-- Screen Area -->
  <g clip-path="url(#phoneScreenClip)">
    <clipPath id="phoneScreenClip">
      <rect x="15" y="15" width="350" height="750" rx="32" fill="#fff"/>
    </clipPath>

    <!-- Screen Background (Clean Modern Soft Slate) -->
    <rect x="15" y="15" width="350" height="750" fill="#F1F5F9"/>

    <!-- Status Bar (Minimal Apple Style) -->
    <text x="44" y="42" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">14:15</text>
    <!-- Dynamic Island -->
    <rect x="135" y="27" width="110" height="25" rx="12.5" fill="#000000"/>
    <circle cx="228" cy="39" r="4.5" fill="#1b2430"/>
    <!-- Battery & Signal -->
    <path d="M 312 32 h 15 a 2 2 0 0 1 2 2 v 9 a 2 2 0 0 1 -2 2 h -15 a 2 2 0 0 1 -2 -2 v -9 a 2 2 0 0 1 2 -2 z" fill="none" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="314" y="34" width="10" height="9" rx="1" fill="#25D366"/>
    <path d="M 330 36 h 2 v 5 h -2 z" fill="#0F172A"/>

    <!-- App / Site Header -->
    <rect x="15" y="66" width="350" height="66" fill="url(#clinicHeaderGrad)"/>
    <!-- Cross/Health Icon Badge -->
    <circle cx="48" cy="99" r="16" fill="#ffffff" opacity="0.12"/>
    <path d="M 48 91 V 107 M 40 99 H 56" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="74" y="95" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="-0.2">CLÍNICA VIVER BEM</text>
    <!-- Active Status -->
    <circle cx="78" cy="108" r="3.5" fill="#25D366"/>
    <text x="86" y="112" fill="#93C5FD" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">Aberto agora • CRM Ativo</text>
    <!-- Quick Contact Pill -->
    <rect x="272" y="85" width="76" height="28" rx="8" fill="#25D366"/>
    <text x="310" y="103" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800">CONTATO</text>

    <!-- Main Hero Card (Clean, focused, high contrast) -->
    <g transform="translate(28, 150)">
      <rect x="0" y="0" width="324" height="210" rx="18" fill="url(#phoneCardGrad)" stroke="#CBD5E1" stroke-width="1" filter="url(#subtleShadow)"/>
      
      <!-- Category Badge -->
      <rect x="16" y="16" width="112" height="22" rx="11" fill="#E0F2FE"/>
      <text x="72" y="31" text-anchor="middle" fill="#0369A1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="0.5">ESPECIALIDADES</text>
      
      <!-- Headline -->
      <text x="16" y="66" fill="#0F172A" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800">Cuidado e Confiança</text>
      <text x="16" y="88" fill="#0F2942" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800">Para Sua Família</text>
      
      <!-- Subtitle -->
      <text x="16" y="112" fill="#64748B" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500">Atendimento humanizado e equipe qualificada.</text>

      <!-- Primary CTA button -->
      <g transform="translate(16, 136)">
        <rect x="0" y="0" width="292" height="48" rx="12" fill="#25D366"/>
        <!-- WhatsApp Icon inside button -->
        <g transform="translate(24, 15) scale(0.75)">
          <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.587-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.299.144.347.491 1.2.534 1.287.043.087.072.188.014.303-.058.116-.087.188-.173.289l-.26.303c-.087.086-.177.18-.076.353.101.173.449.741.964 1.2.662.591 1.221.774 1.394.86.173.086.275.072.376-.044.101-.116.433-.506.549-.68.116-.173.231-.144.39-.086s1.011.477 1.184.564.289.13.332.202c.044.073.044.419-.1.824z" fill="#FFFFFF"/>
        </g>
        <text x="156" y="30" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="800" letter-spacing="0.2">AGENDAR VIA WHATSAPP</text>
      </g>
    </g>

    <!-- Social Proof Minimal Pill -->
    <g transform="translate(28, 380)">
      <rect x="0" y="0" width="324" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <!-- Google 'G' -->
      <circle cx="24" cy="23" r="12" fill="#F8FAFC"/>
      <text x="24" y="27" text-anchor="middle" fill="#4285F4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900">G</text>
      <text x="44" y="26" fill="#0F172A" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">Avaliação 4.9 no Google</text>
      <text x="230" y="26" fill="#16A34A" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700">★ ★ ★ ★ ★</text>
    </g>

    <!-- Single Clean Featured Service (No clutter!) -->
    <g transform="translate(28, 444)">
      <rect x="0" y="0" width="324" height="84" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="14" y="16" width="52" height="52" rx="12" fill="#E4ECF4"/>
      <path d="M 40 32 V 44 C 40 50 30 50 30 44 V 32" fill="none" stroke="#0F2942" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="40" cy="52" r="3.5" fill="#0F2942"/>
      
      <text x="78" y="38" fill="#0F172A" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="800">Atendimento Médico</text>
      <text x="78" y="56" fill="#64748B" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">Consultas rápidas e preventivas</text>
      
      <circle cx="295" cy="42" r="14" fill="#F1F5F9"/>
      <path d="M 292 37 L 297 42 L 292 47" fill="none" stroke="#0F2942" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Generous Breathing Space at Bottom -->
    <!-- Minimalist Bottom WhatsApp Bar -->
    <g transform="translate(28, 620)">
      <rect x="0" y="0" width="324" height="52" rx="14" fill="#0F2942"/>
      <circle cx="28" cy="26" r="14" fill="#25D366"/>
      <path d="M 28 20 C 24.7 20 22 22.7 22 26 C 22 27.2 22.3 28.2 22.9 29.1 L 22.2 31.8 L 25 31.1 C 25.9 31.7 26.9 32 28 32 C 31.3 32 34 29.3 34 26 C 34 22.7 31.3 20 28 20 Z" fill="#FFFFFF"/>
      <text x="52" y="30" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">Dúvidas? Fale Conosco</text>
      <text x="280" y="30" text-anchor="middle" fill="#93C5FD" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">→</text>
    </g>

    <!-- iOS Home Bar Indicator -->
    <rect x="125" y="746" width="130" height="4" rx="2" fill="#0F172A" opacity="0.3"/>
  </g>
</svg>