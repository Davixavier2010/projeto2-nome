<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" class="rida-luxury-logo" fill="none">
  <defs>
    <!-- Light Mode Gradient -->
    <linearGradient id="ridaBladeLight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="ridaBladeLight2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183C60"/>
      <stop offset="100%" stop-color="#0A1C2E"/>
    </linearGradient>

    <!-- Dark Mode Gradient -->
    <linearGradient id="ridaBladeDark1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="ridaBladeDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Precision Drop Shadow -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.12"/>
    </filter>
    <filter id="luxuryGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Central Emblem Group -->
  <g transform="translate(70, 70)">
    <!-- 6 Interlocking Precision Blades -->
    <g transform="rotate(0)">
        <path d="M 0 -58 C 22 -58 42 -42 50 -20 C 34 -20 18 -14 6 -2 L 10 -22 C 8 -34 0 -44 0 -58 Z" 
              class="rida-blade blade-even" 
              stroke="rgba(255,255,255,0.15)" 
              stroke-width="0.75" 
              stroke-linejoin="round"/>
      </g>
    <g transform="rotate(60)">
        <path d="M 0 -58 C 22 -58 42 -42 50 -20 C 34 -20 18 -14 6 -2 L 10 -22 C 8 -34 0 -44 0 -58 Z" 
              class="rida-blade blade-odd" 
              stroke="rgba(255,255,255,0.15)" 
              stroke-width="0.75" 
              stroke-linejoin="round"/>
      </g>
    <g transform="rotate(120)">
        <path d="M 0 -58 C 22 -58 42 -42 50 -20 C 34 -20 18 -14 6 -2 L 10 -22 C 8 -34 0 -44 0 -58 Z" 
              class="rida-blade blade-even" 
              stroke="rgba(255,255,255,0.15)" 
              stroke-width="0.75" 
              stroke-linejoin="round"/>
      </g>
    <g transform="rotate(180)">
        <path d="M 0 -58 C 22 -58 42 -42 50 -20 C 34 -20 18 -14 6 -2 L 10 -22 C 8 -34 0 -44 0 -58 Z" 
              class="rida-blade blade-odd" 
              stroke="rgba(255,255,255,0.15)" 
              stroke-width="0.75" 
              stroke-linejoin="round"/>
      </g>
    <g transform="rotate(240)">
        <path d="M 0 -58 C 22 -58 42 -42 50 -20 C 34 -20 18 -14 6 -2 L 10 -22 C 8 -34 0 -44 0 -58 Z" 
              class="rida-blade blade-even" 
              stroke="rgba(255,255,255,0.15)" 
              stroke-width="0.75" 
              stroke-linejoin="round"/>
      </g>
    <g transform="rotate(300)">
        <path d="M 0 -58 C 22 -58 42 -42 50 -20 C 34 -20 18 -14 6 -2 L 10 -22 C 8 -34 0 -44 0 -58 Z" 
              class="rida-blade blade-odd" 
              stroke="rgba(255,255,255,0.15)" 
              stroke-width="0.75" 
              stroke-linejoin="round"/>
      </g>

    <!-- Center Precision Hexagon Ring -->
    <polygon points="0,-12 10.39,-6 10.39,6 0,12 -10.39,6 -10.39,-6" 
             fill="none" 
             stroke="currentColor" 
             stroke-width="1.2" 
             opacity="0.25"/>
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="2.5" fill="currentColor" opacity="0.35"/>
  </g>
</svg>